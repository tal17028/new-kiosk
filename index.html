<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Seahorse Exhibit Kiosk</title>

    <link rel="preload" href="assets/seahorse-underwater-bg-1280.jpg" as="image">
    <link rel="stylesheet" href="styles.css?v=button-playground43">

    <!-- SAFE ONLY: fish tail positioning (no layout interference) -->
    <style>
      .fish-button {
        position: relative;
        overflow: visible;
      }

      .fish-button .fish-tail-outline {
        position: absolute;
        right: -90px;
        top: 50%;
        transform: translateY(-50%);
        pointer-events: none;
        z-index: 0;
      }

      .fish-button.fish-reverse .fish-tail-outline {
        right: auto;
        left: -90px;
        transform: translateY(-50%) scaleX(-1);
      }
    </style>
  </head>

  <body>
    <main id="app" class="kiosk" data-layout="1" aria-live="polite">

      <!-- HOME SCREEN -->
      <section id="homeScreen" class="screen new-title-screen is-active" data-screen="home">
        <img class="background-art" src="assets/seahorse-underwater-bg-1280.jpg" alt="">
        <div class="water-tint"></div>

        <div class="light-rays" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>

        <div class="swimming-seahorse-stage" aria-hidden="true">
          <span class="swimming-seahorse swim-friend swim-friend-two">
            <img src="assets/cartoon-seahorse-generated.png" alt="">
          </span>
          <span class="swimming-seahorse swim-friend swim-friend-one">
            <img src="assets/cartoon-seahorse-generated.png" alt="">
          </span>
        </div>

        <button id="altStartButton" class="start-button new-title-start" type="button">
          <span>START</span>
        </button>

        <div class="swimming-seahorse-stage swimming-seahorse-foreground" aria-hidden="true">
          <span class="swimming-seahorse swim-main">
            <img src="assets/cartoon-seahorse-generated.png" alt="">
          </span>
        </div>
      </section>

      <!-- CHALLENGE SCREEN -->
      <section id="challengeScreen" class="screen challenge-screen" data-screen="challenge">
        <img class="background-art" src="assets/seahorse-underwater-bg-1280.jpg" alt="">
        <div class="water-tint challenge-tint"></div>

        <button id="challengeHomeButton" class="challenge-home-button" type="button" aria-label="Home">
          Home
        </button>

        <div class="challenge-shell">
          <div class="challenge-hero">
            <button id="junoButton" class="juno-sprite juno-button" type="button" aria-label="Tickle Juno">
              <img id="junoImage" src="assets/juno.png" alt="Juno">
            </button>

            <div class="brand-lockup">
              <img src="assets/juno-ocean-adventures-logo-user-upscaled.png" alt="Juno's Ocean Adventures">
            </div>
          </div>

          <div class="challenge-grid" aria-label="Choose a challenge">
            <button class="challenge-card explorer" data-mode="explorer">
              <span class="challenge-icon">🔍</span>
              <strong>Explorer</strong>
              <span class="challenge-age">Ages 4–7</span>
            </button>

            <button class="challenge-card detective" data-mode="detective">
              <span class="challenge-icon">🕵️</span>
              <strong>Detective</strong>
              <span class="challenge-age">Ages 8–11</span>
            </button>

            <button class="challenge-card scientist" data-mode="scientist">
              <span class="challenge-icon">🔬</span>
              <strong>Scientist</strong>
              <span class="challenge-age">Ages 14–18</span>
            </button>
          </div>
        </div>
      </section>

      <!-- PLAYGROUND SCREEN -->
      <section id="playgroundScreen" class="screen playground-screen" data-screen="playground">
        <img class="background-art" src="assets/seahorse-underwater-bg-1280.jpg" alt="">
        <div class="water-tint playground-tint"></div>

        <button id="playgroundBackButton" class="challenge-home-button playground-back-button" type="button">
          Back
        </button>

        <div class="playground-shell">
          <h2>Button Playground</h2>

          <div class="playground-grid">

            <!-- FISH BUTTONS (UNCHANGED) -->
            <button class="aqua-button fish-button fish-coral" type="button">
              <i class="fish-tail-outline"></i>
              <span>Explorer</span>
            </button>

            <button class="aqua-button fish-button fish-lime" type="button">
              <i class="fish-tail-outline"></i>
              <span>Detective</span>
            </button>

            <button class="aqua-button fish-button fish-moon" type="button">
              <i class="fish-tail-outline"></i>
              <span>Scientist</span>
            </button>

            <button class="aqua-button fish-button fish-ribbon fish-button-tall" type="button">
              <i class="fish-tail-outline"></i>
              <span class="fish-label"><b>Explorer</b><small>Ages 4–7</small></span>
            </button>

            <button class="aqua-button fish-button fish-speckle fish-button-tall" type="button">
              <i class="fish-tail-outline"></i>
              <span class="fish-label"><b>Detective</b><small>Ages 8–11</small></span>
            </button>

            <button class="aqua-button fish-button fish-deep fish-button-tall" type="button">

              <span class="fish-label"><b>Scientist</b><small>Ages 14–18</small></span>
            </button>

            <button class="aqua-button fish-button fish-sunburst fish-button-icon" type="button">
              <i class="fish-tail-outline"></i>
              <span class="fish-label"><b>🔍 Explorer</b><small>Ages 4–7</small></span>
            </button>

            <button class="aqua-button fish-button fish-bubblegum fish-button-icon" type="button">
              <i class="fish-tail-outline"></i>
              <span class="fish-label"><b>🕵️ Detective</b><small>Ages 8–11</small></span>

            <button class="aqua-button fish-button fish-reef fish-button-icon" type="button">

            <button class="aqua-button fish-button fish-bubblegum fish-naked" type="button">
              <i class="fish-tail-outline"></i>
              <span class="fish-label"><b>Detective</b><small>Ages 8-11</small></span>

            </button>

              <i class="fish-tail-outline"></i>

            </button>

            <button class="aqua-button fish-button fish-lime fish-naked fish-naked-icon" type="button">

            </button>

            <button class="aqua-button fish-button fish-moon fish-naked fish-naked-icon" type="button">

            </button>

            <button class="aqua-button creature-button clam-flat-button" type="button">
              <span><b>Detective</b><small>Ages 8-11</small></span>
            </button>

            <button class="aqua-button creature-button oyster-button" type="button">
              <span><b>Scientist</b><small>Ages 14-18</small></span>
            </button>

            <button class="aqua-button creature-button scallop-button" type="button">
              <span><b>Explorer</b><small>Fan shell</small></span>
            </button>

            <button class="aqua-button creature-button pearl-shell-button" type="button">
              <span><b>Clue Shell</b><small>Ages 8-11</small></span>

            <button class="aqua-button fish-button fish-bubblegum fish-naked fish-reverse" type="button">
              <i class="fish-tail-outline"></i>

            </button>

            <button class="aqua-button fish-button fish-reef fish-naked-icon" type="button">

              <span class="fish-label"><b>&#128300; Lab Fish</b><small>Ages 14-18</small></span>
            </button>

            <button class="aqua-button creature-button mussel-button" type="button">
              <span><b>Deep Dive</b><small>Dark shell</small></span>
            </button>

            <button class="aqua-button creature-button cockle-button" type="button">
              <span><b>Shell Hunt</b><small>Ridged CTA</small></span>
            </button>

            <button class="aqua-button creature-button sand-dollar-button" type="button">
              <span><b>Detective</b><small>Sand dollar</small></span>
            </button>

            <button class="aqua-button creature-button tide-shell-button" type="button">
              <span><b>Scientist</b><small>Tide shell</small></span>
            </button>

            <button class="aqua-button creature-button octopus-button" type="button">
              <span><b>Octopus</b><small>Wiggly arms</small></span>
            </button>

            <button class="aqua-button creature-button jelly-dome-button" type="button">
              <span><b>Jelly Glow</b><small>Floating bell</small></span>
            </button>

            <button class="aqua-button creature-button crab-button" type="button">
              <span><b>Crab Clue</b><small>Pinch CTA</small></span>
            </button>

            <button class="aqua-button creature-button crab-walk-button" type="button">
              <span><b>Crab Walk</b><small>Arms + legs</small></span>
            </button>

            <button class="aqua-button creature-button puffer-button" type="button">
              <span><b>Puffer Pop</b><small>Round choice</small></span>
            </button>

            <button class="aqua-button creature-button squid-button" type="button">
              <span><b>Squid Sprint</b><small>Arrow shape</small></span>
            </button>

            <button class="aqua-button silhouette-button whale-silhouette-button" type="button" aria-label="Whale Wave">

            <button class="aqua-button silhouette-button shark-silhouette-button" type="button" aria-label="Shark Scout">

            </button>

            <button class="aqua-button creature-button anchor-button" type="button">
              <span><b>Anchor</b><small>Strong tab</small></span>
            </button>

            <button class="aqua-button creature-button treasure-button" type="button">
              <span><b>Treasure</b><small>Reward style</small></span>
            </button>

            <button class="aqua-button creature-button kelp-button" type="button">
              <span><b>Kelp Gate</b><small>Leafy CTA</small></span>
            </button>

          </div>
        </div>
      </section>

      <!-- GAME SCREEN -->
      <section id="gameScreen" class="screen game-screen" data-screen="game">
        <button id="gameBackButton" class="game-back-button" type="button" aria-label="Home">
          Home
        </button>
        <div id="missionApp" class="mission-app" aria-live="polite"></div>
      </section>

    </main>

    <script src="app.js?v=button-playground43"></script>
  </body>
</html>
